<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            background: #0e0e0e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        img {
            max-width: 95%;
            max-height: 95vh;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, .6);
        }

        p {
            color: #fff;
            font-family: sans-serif;
        }
    </style>
</head>

<body>
    <img id="preview-img" src="" alt="Dashboard Preview">

    <script>
        const params = new URLSearchParams(window.location.search);
        const imgUrl = params.get("img");
        const imgEl = document.getElementById("preview-img");

        if (imgUrl) {
            imgEl.src = imgUrl;
        } else {
            document.body.innerHTML = "<p>Gambar tidak ditemukan.</p>";
        }
    </script>
</body>

</html>
